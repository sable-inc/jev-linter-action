name: Jev Linter
description: Evaluate repository files against authored yes/no review questions with TypeSafe Jev.
author: sable-inc
branding:
  icon: check-circle
  color: purple
inputs:
  config:
    description: Repository-relative JSON lint configuration.
  model:
    description: Jev model ID, for example jev-1.13.0. Required with inline inputs.
  glob:
    description: Repository-relative target file glob (for example a complete built agent bundle); multiple patterns may be separated by newlines. Oversized inputs are reviewed in overlapping batches.
  questions:
    description: YAML list of yes/no questions. Strings expect yes with probability at least 0.8; objects can override expect and minProbability.
  per-file:
    description: Review each file separately instead of reviewing all matched files together.
    default: 'false'
  api-key:
    description: TypeSafe API key, required for linting. Not used by publish-reports. Selected target contents are sent to TypeSafe.
  locate:
    description: Ask Jev to identify authored passages contributing to failed rules. Leaves the original verdict unchanged.
    default: 'false'
  changed-lines-only:
    description: Review only PR additions against every rule, using target files as context. Requires locate, github-token and a same-repository pull_request event. Findings require 0.8 violation probability; unavailable patches, added lines over 1800 characters, whitespace-only added passages or exhausted budgets fail as incomplete. Deletion-only regressions are not covered.
    default: 'false'
  source-glob:
    description: Newline-separated globs of authored source files for line mapping. Optional patterns may match no files; the total set must not be empty.
  locate-max-requests:
    description: Maximum additional Jev localization requests per action run (1–512), with up to four source passages batched per request. Omitted candidates are reported.
    default: '32'
  post-comments:
    description: Post inline findings in one review. For a matrix, keep this false and use one downstream publish-reports step. Never posts conversation summaries.
    default: 'false'
  github-token:
    description: GitHub token required for publish-reports, post-comments and changed-lines-only; optional for diff prioritization during whole-input localization. Never sent to TypeSafe.
  review-id:
    description: Stable identifier for the combined PR review, used to deduplicate inline findings across runs and commits.
  max-comments:
    description: Maximum new inline comments for this review-id and PR head (0–20). Other findings remain in check summaries and artifacts.
    default: '5'
  publish-reports:
    description: Globs of saved reports from this workflow run. Publishes one deduplicated inline review without calling Jev. Mutually exclusive with lint inputs.
outputs:
  report:
    description: JSON report path. Localization additionally records verified source passages and line ranges.
  passed:
    description: Whether all questions passed.
runs:
  using: node24
  main: dist/main.mjs
