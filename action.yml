name: Jev Linter
description: Evaluate repository files against authored yes/no review questions with TypeSafe Jev.
author: sable-inc
branding:
  icon: check-circle
  color: purple
inputs:
  config:
    description: Repository-relative JSON lint configuration.
  model:
    description: Jev model ID, for example jev-1.13.0. Required with inline inputs.
  glob:
    description: Repository-relative file glob; multiple patterns may be separated by newlines.
  questions:
    description: YAML list of yes/no questions. Strings expect yes with probability at least 0.8; objects can override expect and minProbability.
  per-file:
    description: Review each file separately instead of reviewing all matched files together.
    default: 'false' 
  api-key:
    description: TypeSafe API key. Selected target contents are sent to TypeSafe.
    required: true
outputs:
  report:
    description: JSON report path, containing judgments and file names but no file contents.
  passed:
    description: Whether all questions passed.
runs:
  using: node24
  main: dist/main.mjs
